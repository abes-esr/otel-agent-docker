# Extensions pour la découverte dynamique des services et conteneurs
extensions:
  # docker_observer écoute les événements de l'API Docker pour détecter l'apparition et l'arrêt des conteneurs
  docker_observer:
    endpoint: unix:///var/run/docker.sock
    # Permet de découvrir tous les conteneurs (même ceux sans ports réseau exposés)
    include_all_containers: true
    # Exclusion de l'agent lui-même pour prévenir toute boucle infinie d'ingestion de ses propres logs
    excluded_images:
      - "*otel/opentelemetry-collector-contrib*"

# Configuration des récepteurs de télémétrie (métriques et logs)
receivers:
  # Utilisation du récepteur standard docker_stats pour collecter les métriques Docker
  docker_stats:
    api_version: "1.54"
    env_vars_to_metric_labels:
      # Extrait la version spécifique à chaque conteneur
      OTEL_VERSION: service.version
      # Extrait le nom logique du service configuré dans le conteneur
      OTEL_SERVICE_NAME: service.name
      # Extrait le profil Spring actif si présent (utile pour les API et batchs)
      SPRING_PROFILES_ACTIVE: spring.profiles.active
      # Extrait le namespace de l'application à partir des variables d'environnement du Docker Compose
      OTEL_NAMESPACE: service.namespace
    container_labels_to_metric_labels:
      # Extrait le nom du service Docker Compose
      com.docker.compose.service: compose.service
      # Extrait le nom du projet Docker Compose
      com.docker.compose.project: compose.project

  # Collecteur dynamique de logs pour conteneurs Docker
  receiver_creator:
    watch_observers: [docker_observer]
    receivers:
      filelog:
        # Filtrage sur port == 0 pour ne créer qu'une seule instance de récepteur par conteneur découvert
        rule: type == "container" && port == 0
        config:
          # Chemin vers le fichier journal JSON standard généré par Docker sur l'hôte
          include:
            - /var/lib/docker/containers/`container_id`/`container_id`-json.log
          start_at: end
          include_file_path: true
          operators:
            # Parseur de logs conteneur (extrait automatiquement le flux, le timestamp et le contenu du log)
            - type: container
              format: docker
        # Injection des attributs de ressource associés au conteneur
        resource_attributes:
          container.name: "`name`"
          container.id: "`container_id`"
          container.image.name: "`image`"

  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      network:

# Configuration des processeurs pour transformer les données collectées
processors:
  # Utilisation du processeur standard resource pour mapper les attributs de ressources des conteneurs
  resource/containers:
    attributes:
      # Map le service.name sur le nom du conteneur Docker inspecté
      - key: service.name
        from_attribute: container.name
        action: upsert
      # Ajout de l'environnement de déploiement à partir des variables d'environnement du Docker Compose
      - key: deployment.environment
        value: ${OTEL_ENVIRONMENT}
        action: upsert
      # Ajout du nom de l'hôte physique à partir des variables d'environnement du Docker Compose
      - key: host.name
        value: ${HOSTNAME}
        action: upsert

  # Normalisation du nom de conteneur et de service en retirant le slash initial (/) renvoyé par l'API Docker
  transform/containers:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - replace_pattern(attributes["container.name"], "^/(.*)", "$1")
          - replace_pattern(attributes["service.name"], "^/(.*)", "$1")

  # Utilisation du processeur standard resource pour définir les attributs de la machine hôte
  resource/host:
    attributes:
      - key: service.name
        value: ${HOSTNAME}
        action: upsert
      - key: deployment.environment
        value: ${OTEL_ENVIRONMENT}
        action: upsert
      - key: service.namespace
        value: ${HOSTNAME}
        action: upsert
      - key: host.name
        value: ${HOSTNAME}
        action: upsert

  # Processeur de batching standard pour regrouper la télémétrie et optimiser les exports
  batch:

exporters:
  otlp:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT_GRPC}
    tls:
      insecure: true

# Définition des pipelines de collecte de télémétrie
service:
  extensions: [docker_observer]
  pipelines:
    metrics/containers:
      receivers: [docker_stats]
      processors: [resource/containers, batch]
      exporters: [otlp]
    metrics/host:
      receivers: [host_metrics]
      processors: [resource/host, batch]
      exporters: [otlp]
    logs/containers:
      receivers: [receiver_creator]
      processors: [resource/containers, transform/containers, batch]
      exporters: [otlp]
